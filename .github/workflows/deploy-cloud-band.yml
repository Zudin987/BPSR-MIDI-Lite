name: Deploy Cloud Band production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY-BAND-AUTH to confirm updated client binaries are ready"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-band-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY-BAND-AUTH'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout exact production commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Cloudflare credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo 'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets first.' >&2
            exit 1
          fi

      - name: Install Worker dependencies
        working-directory: cloudflare-band
        run: npm install

      - name: Run security tests and preflight
        working-directory: cloudflare-band
        run: |
          node --check src/index.js
          node --check smoke-live.mjs
          node --test test-security.cjs
          npx wrangler deploy --dry-run --outdir .wrangler-dry-run

      - name: Deploy existing Cloudflare Worker
        working-directory: cloudflare-band
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Verify deployed authorization and MIDI sharing
        run: node cloudflare-band/smoke-live.mjs
