name: Build Windows Studio

on:
  pull_request:
    paths:
      - "studio_*.py"
      - "BPSR-MIDI-Studio.spec"
      - "requirements-studio*.txt"
      - "STUDIO*.md"
      - "tests/test_studio*.py"
      - ".github/workflows/build-studio.yml"
      - "app.py"
      - "modern_ui.py"
      - "online_*.py"
      - "midi_engine.py"
      - "profiles.py"
      - "player.py"
      - "win_input.py"
      - "theme.py"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional Studio version, for example 0.1.0-beta. Leave blank to build only."
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-studio:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-studio-build.txt

      - name: Install Studio dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-studio-build.txt

      - name: Verify AI and audio runtimes
        shell: pwsh
        run: |
          python -c "from basic_pitch import ICASSP_2022_MODEL_PATH; from basic_pitch.inference import Model; m=Model(ICASSP_2022_MODEL_PATH); print('Basic Pitch model:', ICASSP_2022_MODEL_PATH)"
          python -c "import onnxruntime as ort; print('ONNX providers:', ort.get_available_providers())"
          python -c "from imageio_ffmpeg import get_ffmpeg_exe; import os; p=get_ffmpeg_exe(); print('FFmpeg:', p); assert os.path.exists(p)"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build Studio portable app
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Studio.spec

      - name: Verify packaged Studio files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BPSR-MIDI-Studio/BPSR-MIDI-Studio.exe")) {
            throw "Studio EXE was not created"
          }
          $model = Get-ChildItem "dist/BPSR-MIDI-Studio" -Recurse -Filter "*.onnx" | Select-Object -First 1
          if (-not $model) { throw "Basic Pitch ONNX model was not packaged" }
          $ffmpeg = Get-ChildItem "dist/BPSR-MIDI-Studio" -Recurse -Filter "ffmpeg*.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg executable was not packaged" }

      - name: Prepare Studio download
        shell: pwsh
        run: |
          Copy-Item STUDIO.md dist/BPSR-MIDI-Studio/STUDIO.md
          Copy-Item LICENSE dist/BPSR-MIDI-Studio/LICENSE
          Copy-Item STUDIO_THIRD_PARTY_NOTICES.md dist/BPSR-MIDI-Studio/STUDIO_THIRD_PARTY_NOTICES.md

          New-Item -ItemType Directory -Force release-studio | Out-Null
          Compress-Archive -Path dist/BPSR-MIDI-Studio -DestinationPath release-studio/BPSR-MIDI-Studio-Windows-x64.zip -Force

          $hash = (Get-FileHash release-studio/BPSR-MIDI-Studio-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BPSR-MIDI-Studio-Windows-x64.zip" | Set-Content release-studio/SHA256SUMS-STUDIO.txt

      - name: Upload Studio artifact
        uses: actions/upload-artifact@v6
        with:
          name: BPSR-MIDI-Studio-Windows
          path: release-studio/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Studio release when requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          STUDIO_VERSION: ${{ inputs.release_version }}
        run: |
          $version = $env:STUDIO_VERSION.Trim()
          if ($version.StartsWith("studio-v")) {
            $tag = $version
          } elseif ($version.StartsWith("v")) {
            $tag = "studio-$version"
          } else {
            $tag = "studio-v$version"
          }

          gh release create $tag `
            release-studio/BPSR-MIDI-Studio-Windows-x64.zip `
            release-studio/SHA256SUMS-STUDIO.txt `
            --target $env:GITHUB_SHA `
            --title "BPSR MIDI Studio $version" `
            --notes-file STUDIO_CHANGELOG.md
