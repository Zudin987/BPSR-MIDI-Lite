name: Studio real audio smoke

on:
  pull_request:
    paths:
      - "studio_band/**"
      - "studio_band_worker.py"
      - "requirements-studio*.txt"
      - "tests/test_studio_band_live.py"
      - "tests/studio_synthetic_audio.py"
      - ".github/workflows/studio-band-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-audio:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-studio-build.txt
      - name: Install Studio and isolated runtime bootstrap
        run: python -m pip install -r requirements-studio-build.txt uv==0.8.22
      - name: Run clean first-use runtime and actual model inference
        env:
          BPSR_STUDIO_LIVE: "1"
          BPSR_STUDIO_CLEAN_RUNTIME: "1"
          BPSR_STUDIO_BAND_HOME: ${{ runner.temp }}\bpsr-studio-clean-${{ github.run_id }}-${{ github.run_attempt }}
        run: python -m pytest tests/test_studio_band_live.py -s -q
      - name: Upload provider verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Studio-real-audio-provider-report
          path: model-smoke-report/*
          if-no-files-found: warn
          retention-days: 30

  hq-audio:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-studio-build.txt
      - name: Install Studio and isolated runtime bootstrap
        run: python -m pip install -r requirements-studio-build.txt uv==0.8.22
      - name: Verify actual HQ separation and original timeline
        env:
          BPSR_STUDIO_HQ_LIVE: "1"
        run: python -m pytest tests/test_studio_band_live.py::test_real_hq_separation -s -q
      - name: Upload HQ provider verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Studio-HQ-provider-report
          path: hq-smoke-report/*
          if-no-files-found: warn
          retention-days: 30
