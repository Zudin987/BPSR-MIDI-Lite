name: Publish v2.5.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.5.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out merged v2.5.0 source
        uses: actions/checkout@v6
        with:
          ref: d9aea21baf4b098de8077bc50d38a8d97c28ee59

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build standalone EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Lite.spec

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe release/BPSR-MIDI-Lite.exe

          New-Item -ItemType Directory -Force portable/BPSR-MIDI-Lite | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe portable/BPSR-MIDI-Lite/BPSR-MIDI-Lite.exe
          Copy-Item README.md portable/BPSR-MIDI-Lite/README.md
          Copy-Item LICENSE portable/BPSR-MIDI-Lite/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md portable/BPSR-MIDI-Lite/THIRD_PARTY_NOTICES.md

          Compress-Archive -Path portable/BPSR-MIDI-Lite -DestinationPath release/BPSR-MIDI-Lite-Windows-x64.zip -Force

          $hashExe = (Get-FileHash release/BPSR-MIDI-Lite.exe -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash release/BPSR-MIDI-Lite-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BPSR-MIDI-Lite.exe" | Set-Content release/SHA256SUMS.txt
          "$hashZip  BPSR-MIDI-Lite-Windows-x64.zip" | Add-Content release/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # BPSR MIDI Lite v2.5.0

          Instrument-aware MIDI fitting based on confirmed BPSR in-game layouts.

          - Piano/Keyboard keeps the established fidelity-first fitting behavior unchanged.
          - Guitar still minimizes remapping first, then conservatively protects the upper melody/chord voice when otherwise-comparable choices exist.
          - Bass keeps the low line and uses contour-aware octave selection to reduce register ping-pong, unnatural jumps, and direction reversals.
          - Bass Category 2 uses the single E1-B3 High Octave layout: the app switches High once at the start and stays there.
          - Added regression coverage for unchanged Keyboard behavior, Guitar upper-voice tie-breaking, Bass contour stability, and one-switch Bass Category 2 playback.
          - No changes to the UI, keyboard-input backends, BPSR note timing, Raw MIDI behavior, safe no-page ranges, or the no-< / > invariant.
          '@ | Set-Content release-notes.md

          gh release create v2.5.0 `
            release/BPSR-MIDI-Lite.exe `
            release/BPSR-MIDI-Lite-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --target d9aea21baf4b098de8077bc50d38a8d97c28ee59 `
            --title "BPSR MIDI Lite v2.5.0" `
            --notes-file release-notes.md
