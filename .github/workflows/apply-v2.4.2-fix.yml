name: Apply v2.4.2 fitting fix

on:
  push:
    branches:
      - agent/v2.4.2-stable-fitting
    paths:
      - .github/workflows/apply-v2.4.2-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/v2.4.2-stable-fitting
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply fitting fix
        run: |
          python tools/apply_v242_fix.py
          python tools/fix_v242_contract.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run full tests
        run: python -m pytest -q

      - name: Commit validated changes and remove migration files
        run: |
          rm -f tools/apply_v242_fix.py tools/fix_v242_contract.py .github/workflows/apply-v2.4.2-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize Guitar and Bass category fitting"
          git push origin HEAD:agent/v2.4.2-stable-fitting
