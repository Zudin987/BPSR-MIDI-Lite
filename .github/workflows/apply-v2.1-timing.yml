name: Apply v2.1 timing audit

on:
  push:
    branches:
      - agent/adaptive-midi-timing-v2.1
    paths:
      - .github/workflows/apply-v2.1-timing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/adaptive-midi-timing-v2.1
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Apply audited timing changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_exact(path, old, new, expected=1):
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              write(path, text.replace(old, new))

          # Preserve original MIDI tempo and authored durations by default.
          replace_exact(
              "midi_engine.py",
              '    speed_percent: int = 85\n    note_length_percent: int = 150\n    minimum_note_ms: int = 120\n    normal_release_gap_ms: int = 18\n    repeated_release_gap_ms: int = 35\n',
              '    speed_percent: int = 100\n    note_length_percent: int = 100\n    minimum_note_ms: int = 70\n    repeated_release_gap_ms: int = 16\n',
          )
          replace_exact(
              "midi_engine.py",
              '        if not 0 <= self.normal_release_gap_ms <= 250:\n            raise ValueError("Normal release gap must be between 0 and 250 ms.")\n',
              '',
          )

          # A malformed MIDI with a missing Note Off must not hold a key for minutes.
          replace_exact(
              "midi_engine.py",
              '                    end=max(start + 0.120, final_time),\n',
              '                    end=max(start + 0.120, min(final_time, start + 0.500)),\n',
          )

          # Replace the old global-next-note clipping algorithm. Different pitches
          # are allowed to overlap; only same-pitch / same-physical-key retriggers
          # force an early release.
          text = read("midi_engine.py")
          start = text.index('def _apply_note_lengths(')
          end = text.index('\ndef _offset_for_source_time', start)
          new_func = '''def _apply_note_lengths(notes: list[PlannedNote], options: PlanOptions) -> list[PlannedNote]:
              """Apply only the articulation correction BPSR actually needs.

              Valid MIDI note durations are musical information, so unrelated note
              onsets must never shorten them. The normal path preserves the authored
              duration and only raises genuinely short presses to ``minimum_note_ms``.
              Advanced users can still intentionally scale durations with
              ``note_length_percent``.

              The one exception is a retrigger conflict: the same pitch or physical
              game key needs a brief released state before its next Note On. In that
              case the earlier note is released just before the retrigger.
              """
              length_ratio = options.note_length_percent / 100.0
              minimum_duration = options.minimum_note_ms / 1000.0
              repeated_gap = options.repeated_release_gap_ms / 1000.0

              stretched: list[PlannedNote] = []
              for note in notes:
                  original_duration = max(0.001, note.end - note.start)
                  target_duration = max(original_duration * length_ratio, minimum_duration)
                  stretched.append(
                      PlannedNote(
                          source_start=note.source_start,
                          source_end=note.source_end,
                          start=note.start,
                          end=note.start + target_duration,
                          pitch=note.pitch,
                          page=note.page,
                          octave=note.octave,
                          key=note.key,
                          velocity=note.velocity,
                          serial=note.serial,
                      )
                  )

              starts_by_pitch: dict[int, list[float]] = defaultdict(list)
              starts_by_key: dict[str, list[float]] = defaultdict(list)
              for note in stretched:
                  starts_by_pitch[note.pitch].append(note.start)
                  starts_by_key[note.key].append(note.start)
              for values in starts_by_pitch.values():
                  values.sort()
              for values in starts_by_key.values():
                  values.sort()

              corrected: list[PlannedNote] = []
              for note in stretched:
                  end = note.end
                  next_conflicts: list[float] = []

                  for values in (starts_by_pitch[note.pitch], starts_by_key[note.key]):
                      index = bisect_right(values, note.start + 1e-9)
                      if index < len(values):
                          next_conflicts.append(values[index])

                  if next_conflicts:
                      next_conflict = min(next_conflicts)
                      latest_reliable_end = next_conflict - repeated_gap
                      if end > latest_reliable_end:
                          # When notes are impossibly close, prefer a small real press
                          # over a mathematically perfect gap that the game may miss.
                          end = max(note.start + 0.020, latest_reliable_end)
                          end = min(end, next_conflict - 0.001)

                  corrected.append(
                      PlannedNote(
                          source_start=note.source_start,
                          source_end=note.source_end,
                          start=note.start,
                          end=max(note.start + 0.010, end),
                          pitch=note.pitch,
                          page=note.page,
                          octave=note.octave,
                          key=note.key,
                          velocity=note.velocity,
                          serial=note.serial,
                      )
                  )

              corrected.sort(key=lambda note: (note.start, note.serial))
              return corrected
          '''
          # Dedent because this heredoc is indented by YAML.
          import textwrap
          new_func = textwrap.dedent(new_func)
          write("midi_engine.py", text[:start] + new_func + text[end:])

          # Fixed beginner profiles: no blanket tempo slowdown or duration inflation.
          replace_exact(
              "profiles.py",
              '    speed: int = 85\n    note_length: int = 150\n    minimum_note: int = 120\n',
              '    speed: int = 100\n    note_length: int = 100\n    minimum_note: int = 70\n',
          )
          replace_exact("profiles.py", '            minimum_note=130,\n', '', expected=2)
          replace_exact("profiles.py", '            note_length=135, minimum_note=130,\n', '', expected=2)
          replace_exact(
              "profiles.py",
              '# Beginner-facing names are intentionally independent from the technical note\n# ranges. The actual planner settings below are unchanged.\n',
              '# Beginner-facing names are intentionally independent from the technical note\n# ranges. Fixed profiles use conservative BPSR-safe articulation defaults.\n',
          )

          # Advanced setup starts from the same safe baseline; saved custom values remain
          # user-owned and are not overwritten during config migration.
          replace_exact(
              "app.py",
              '        "chord_limit": 0, "speed": 85, "length": 150, "minimum_note": 120,\n',
              '        "chord_limit": 0, "speed": 100, "length": 100, "minimum_note": 70,\n',
              expected=2,
          )
          replace_exact(
              "app.py",
              '        "chord_limit": 1, "speed": 85, "length": 135, "minimum_note": 130,\n',
              '        "chord_limit": 1, "speed": 100, "length": 100, "minimum_note": 70,\n',
          )
          replace_exact("app.py", '        self.speed_var = tk.IntVar(value=85)\n', '        self.speed_var = tk.IntVar(value=100)\n')
          replace_exact("app.py", '        self.length_var = tk.IntVar(value=150)\n', '        self.length_var = tk.IntVar(value=100)\n')
          replace_exact("app.py", '        self.minimum_note_var = tk.IntVar(value=120)\n', '        self.minimum_note_var = tk.IntVar(value=70)\n')

          # Regression tests for the exact failure modes found in the audit.
          engine_tests = read("tests/test_engine.py")
          marker = '\ndef test_full_range_prefers_middle_page_ctrl_when_exact_mapping_ties'
          if marker not in engine_tests:
              raise SystemExit("test_engine insertion marker missing")
          additions = r'''

          def test_short_note_gets_small_bpsr_hold_without_changing_tempo(tmp_path: Path) -> None:
              midi_path = tmp_path / "short_hold.mid"
              make_test_midi(midi_path, [60], gap_ticks=0, duration_ticks=10)
              plan = build_plan(
                  midi_path,
                  PlanOptions(
                      mode="stable",
                      speed_percent=100,
                      note_length_percent=100,
                      minimum_note_ms=70,
                  ),
              )

              note_on = next(event for event in plan.events if event.kind == "note_on")
              note_off = next(event for event in plan.events if event.kind == "note_off")
              assert note_off.time - note_on.time >= 0.070 - 1e-9


          def test_unrelated_note_onset_does_not_cut_authored_hold(tmp_path: Path) -> None:
              midi_path = tmp_path / "polyphony.mid"
              midi = mido.MidiFile(type=1, ticks_per_beat=480)
              track = mido.MidiTrack()
              track.append(mido.MetaMessage("set_tempo", tempo=mido.bpm2tempo(120), time=0))
              track.append(mido.Message("note_on", note=60, velocity=80, time=0))
              track.append(mido.Message("note_on", note=64, velocity=80, time=48))
              track.append(mido.Message("note_off", note=64, velocity=0, time=48))
              track.append(mido.Message("note_off", note=60, velocity=0, time=144))
              midi.tracks.append(track)
              midi.save(midi_path)

              plan = build_plan(
                  midi_path,
                  PlanOptions(
                      mode="stable",
                      speed_percent=100,
                      note_length_percent=100,
                      minimum_note_ms=70,
                  ),
              )

              c_on = next(event for event in plan.events if event.kind == "note_on" and event.serial == 0)
              c_off = next(event for event in plan.events if event.kind == "note_off" and event.serial == 0)
              e_on = next(event for event in plan.events if event.kind == "note_on" and event.serial == 1)
              assert e_on.time < c_off.time
              assert c_off.time - c_on.time >= 0.249


          def test_dangling_note_is_capped_instead_of_held_to_song_end(tmp_path: Path) -> None:
              midi_path = tmp_path / "dangling.mid"
              midi = mido.MidiFile(type=1, ticks_per_beat=480)
              track = mido.MidiTrack()
              track.append(mido.MetaMessage("set_tempo", tempo=mido.bpm2tempo(120), time=0))
              track.append(mido.Message("note_on", note=60, velocity=80, time=0))
              track.append(mido.MetaMessage("text", text="later event", time=4800))
              midi.tracks.append(track)
              midi.save(midi_path)

              plan = build_plan(
                  midi_path,
                  PlanOptions(
                      mode="stable",
                      speed_percent=100,
                      note_length_percent=100,
                      minimum_note_ms=70,
                  ),
              )

              note_on = next(event for event in plan.events if event.kind == "note_on")
              note_off = next(event for event in plan.events if event.kind == "note_off")
              assert 0.119 <= note_off.time - note_on.time <= 0.501
          '''
          engine_tests = engine_tests.replace(marker, textwrap.dedent(additions) + marker, 1)
          write("tests/test_engine.py", engine_tests)

          profile_tests = read("tests/test_profiles.py")
          profile_tests += '''\n\ndef test_fixed_profiles_preserve_song_tempo_and_only_floor_short_notes() -> None:\n    for instrument_profiles in FIXED_PROFILES.values():\n        for profile in instrument_profiles.values():\n            assert profile.speed == 100\n            assert profile.note_length == 100\n            assert profile.minimum_note == 70\n'''
          write("tests/test_profiles.py", profile_tests)

          # Version + documentation.
          replace_exact("modern_launcher.py", 'app.APP_VERSION = "2.0.0"\n', 'app.APP_VERSION = "2.1.0"\n')
          replace_exact("version_info.txt", 'filevers=(2, 0, 0, 0)', 'filevers=(2, 1, 0, 0)')
          replace_exact("version_info.txt", 'prodvers=(2, 0, 0, 0)', 'prodvers=(2, 1, 0, 0)')
          replace_exact("version_info.txt", "StringStruct(u'FileVersion', u'2.0.0')", "StringStruct(u'FileVersion', u'2.1.0')")
          replace_exact("version_info.txt", "StringStruct(u'ProductVersion', u'2.0.0')", "StringStruct(u'ProductVersion', u'2.1.0')")

          changelog = read("CHANGELOG.md")
          release_notes = '''# Changelog\n\n## v2.1.0\n\n- Restored normal MIDI tempo to **100%** for every beginner profile instead of slowing all songs to 85%.\n- Restored authored note lengths to **100%** instead of stretching every note to 135–150%.\n- Added a focused **70 ms minimum key hold** so very short MIDI taps are still visible to BPSR without rewriting normal notes.\n- Reduced repeated-key release separation to **16 ms** and only applies early release when the same pitch or physical game key must retrigger.\n- Fixed legitimate held notes being cut short just because an unrelated note started. Polyphony and legato now survive conversion.\n- Capped malformed dangling notes at 500 ms instead of potentially holding a key until the end of the file.\n- Kept page-switch timing, octave/modifier lead, sustain behavior, range mapping, chord handling, and the high-resolution playback scheduler unchanged.\n- Added regression tests for short-note recognition, polyphonic note holds, malformed dangling notes, and beginner-profile timing defaults.\n\n'''
          if not changelog.startswith('# Changelog\n\n'):
              raise SystemExit("Unexpected CHANGELOG header")
          write("CHANGELOG.md", release_notes + changelog[len('# Changelog\n\n'):])

          readme = read("README.md")
          old = '''## Technical core\n\nThe v2 interface is a redesign of the user flow, not a replacement of the MIDI engine. The existing planner/player architecture remains responsible for:\n'''
          new = '''## Technical core\n\nThe planner keeps the MIDI's original tempo and authored note lengths by default. Only unusually short notes are extended to a small 70 ms input-safe hold, and repeated use of the same game key gets a brief release window so BPSR can retrigger it cleanly. This avoids slowing or stretching an entire song just to compensate for keyboard-input behavior.\n\nThe existing planner/player architecture remains responsible for:\n'''
          if old not in readme:
              raise SystemExit("README technical-core marker missing")
          write("README.md", readme.replace(old, new, 1))

          # Self-delete so the branch contains only product changes.
          Path('.github/workflows/apply-v2.1-timing.yml').unlink()
          PY

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests before committing
        run: python -m pytest -q

      - name: Commit audited timing changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tune MIDI timing for BPSR input"
          git push origin HEAD:agent/adaptive-midi-timing-v2.1
