name: Apply v3.0.0 Online Sequencer

on:
  push:
    branches:
      - agent/v3.0-online-sequencer
    paths:
      - tools/apply_v300_ui.py
      - .github/workflows/apply-v3.0.0-online.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v3.0-online-sequencer
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply migration
        run: python tools/apply_v300_ui.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run full test suite
        run: python -m pytest -q

      - name: Commit validated product changes and remove migration scaffolding
        run: |
          rm -f tools/apply_v300_ui.py .github/workflows/apply-v3.0.0-online.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Online Sequencer browser and temporary playback"
          git push origin HEAD:agent/v3.0-online-sequencer
