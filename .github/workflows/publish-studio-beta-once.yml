name: Publish Studio beta once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-studio-beta-once.yml"

permissions:
  contents: write

env:
  PRODUCT_SHA: a3b5cc286199d7a6a496638dd620c9d94fcf1a57
  RELEASE_TAG: studio-v0.1.0-beta

jobs:
  publish:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout exact reviewed Studio commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.PRODUCT_SHA }}

      - name: Install Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-studio-build.txt

      - name: Install Studio dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-studio-build.txt

      - name: Run full tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build Studio portable app
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Studio.spec

      - name: Verify packaged Studio files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BPSR-MIDI-Studio/BPSR-MIDI-Studio.exe")) { throw "Studio EXE was not created" }
          $model = Get-ChildItem "dist/BPSR-MIDI-Studio" -Recurse -Filter "*.onnx" | Select-Object -First 1
          if (-not $model) { throw "Basic Pitch ONNX model was not packaged" }
          $ffmpeg = Get-ChildItem "dist/BPSR-MIDI-Studio" -Recurse -Filter "ffmpeg*.exe" | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg executable was not packaged" }

      - name: Prepare release assets
        shell: pwsh
        run: |
          Copy-Item STUDIO.md dist/BPSR-MIDI-Studio/STUDIO.md
          Copy-Item LICENSE dist/BPSR-MIDI-Studio/LICENSE
          Copy-Item STUDIO_THIRD_PARTY_NOTICES.md dist/BPSR-MIDI-Studio/STUDIO_THIRD_PARTY_NOTICES.md
          New-Item -ItemType Directory -Force release-studio | Out-Null
          Compress-Archive -Path dist/BPSR-MIDI-Studio -DestinationPath release-studio/BPSR-MIDI-Studio-Windows-x64.zip -Force
          $hash = (Get-FileHash release-studio/BPSR-MIDI-Studio-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  BPSR-MIDI-Studio-Windows-x64.zip" | Set-Content release-studio/SHA256SUMS-STUDIO.txt

      - name: Publish Studio beta release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (gh release view $env:RELEASE_TAG 2>$null) {
            gh release upload $env:RELEASE_TAG release-studio/BPSR-MIDI-Studio-Windows-x64.zip release-studio/SHA256SUMS-STUDIO.txt --clobber
          } else {
            gh release create $env:RELEASE_TAG release-studio/BPSR-MIDI-Studio-Windows-x64.zip release-studio/SHA256SUMS-STUDIO.txt --target $env:PRODUCT_SHA --title "BPSR MIDI Studio 0.1.0-beta" --notes-file STUDIO_CHANGELOG.md --prerelease
          }
