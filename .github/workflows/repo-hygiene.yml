name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Block generated distribution binaries in source
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '\.(exe|msi|dll|apk|aab|zip|7z|rar|jar|pyc|pyo)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Generated/binary distribution files must not be committed to the source tree. Publish build outputs as GitHub Release assets instead."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Block credentials and private browser data
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '(^|/)\.env($|\.)|\.(pem|key|p12|pfx|sqlite|sqlite3)$|(^|/)cookies[^/]*\.txt$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Private credentials or browser data must not be committed."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Block personal music and video files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -Ei '\.(mid|midi|wav|mp3|flac|m4a|aac|ogg|webm|mp4|mkv|mov)$' || true)"
          if [[ -n "$forbidden" ]]; then
            echo "::error::Personal or copyrighted media must not be committed to the source tree."
            printf '%s\n' "$forbidden"
            exit 1
          fi

      - name: Block obvious committed secret material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI -- '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}' -- . ':!tests/**' 2>/dev/null; then
            echo "::error::Possible secret material detected in tracked source."
            exit 1
          fi

      - name: Keep release history consolidated
        shell: bash
        run: |
          set -euo pipefail
          stale="$(git ls-files 'RELEASE_NOTES_v*.md' || true)"
          if [[ -n "$stale" ]]; then
            echo "::error::Keep release history in CHANGELOG.md and GitHub Releases instead of standalone RELEASE_NOTES files."
            printf '%s\n' "$stale"
            exit 1
          fi

      - name: Block direct binary links in README
        shell: bash
        run: |
          set -euo pipefail
          for file in README README.md README.markdown README.rst; do
            [[ -f "$file" ]] || continue
            if grep -Ein 'releases/download|https?://[^ )"]+\.(exe|msi|dll|apk|aab|zip|7z|rar|jar)([?#][^ )"]*)?([ )"]|$)' "$file"; then
              echo "::error file=$file::Do not put direct executable/archive download links in the README. Keep binaries in GitHub Releases."
              exit 1
            fi
          done
