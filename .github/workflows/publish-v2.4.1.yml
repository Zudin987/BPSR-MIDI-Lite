name: Publish v2.4.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.4.1.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out merged v2.4.1 source
        uses: actions/checkout@v6
        with:
          ref: 50077a7e9cde2e34e2f4969a4923a6a9f6ec989f

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build standalone EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Lite.spec

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe release/BPSR-MIDI-Lite.exe

          New-Item -ItemType Directory -Force portable/BPSR-MIDI-Lite | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe portable/BPSR-MIDI-Lite/BPSR-MIDI-Lite.exe
          Copy-Item README.md portable/BPSR-MIDI-Lite/README.md
          Copy-Item LICENSE portable/BPSR-MIDI-Lite/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md portable/BPSR-MIDI-Lite/THIRD_PARTY_NOTICES.md

          Compress-Archive -Path portable/BPSR-MIDI-Lite -DestinationPath release/BPSR-MIDI-Lite-Windows-x64.zip -Force

          $hashExe = (Get-FileHash release/BPSR-MIDI-Lite.exe -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash release/BPSR-MIDI-Lite-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BPSR-MIDI-Lite.exe" | Set-Content release/SHA256SUMS.txt
          "$hashZip  BPSR-MIDI-Lite-Windows-x64.zip" | Add-Content release/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # BPSR MIDI Lite v2.4.1

          Small interface cleanup release.

          - Removed Test keyboard input and Copy support info, including their unused diagnostics/test code.
          - Keyboard connection is now always visible under Help & recovery.
          - Kept all four keyboard input methods for compatibility across different PCs.
          - Help & recovery now contains only Restore recommended settings and Keyboard connection.
          - Replaced Add MIDI with Open folder; the song list refreshes automatically when MIDI files are added or removed.
          - Renamed the speed reset action to Restore song speed to default 100%.
          - Instrument and unlocked Category selectors are now side-by-side.
          - No MIDI engine, mapping, instrument range, Raw MIDI, or playback timing behavior changed.
          '@ | Set-Content release-notes.md

          gh release create v2.4.1 `
            release/BPSR-MIDI-Lite.exe `
            release/BPSR-MIDI-Lite-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --target 50077a7e9cde2e34e2f4969a4923a6a9f6ec989f `
            --title "BPSR MIDI Lite v2.4.1" `
            --notes-file release-notes.md
