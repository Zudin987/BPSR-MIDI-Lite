name: Apply v2.4.1 cleanup

on:
  push:
    branches:
      - agent/v2.4.1-ui-trim
    paths:
      - .github/workflows/apply-v2.4.1-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/v2.4.1-ui-trim

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply cleanup migration
        run: python tools/apply_v241_cleanup.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run full tests
        run: python -m pytest -q

      - name: Remove temporary migration files and commit
        run: |
          rm -f tools/apply_v241_cleanup.py
          rm -f .github/workflows/apply-v2.4.1-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove diagnostics and input-test support tooling"
          git push origin HEAD:agent/v2.4.1-ui-trim
