name: Apply v2.3 redesign fixed

on:
  push:
    branches:
      - agent/category-profiles-raw-v2.3
    paths:
      - .github/workflows/apply-v2.3-fixed.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/category-profiles-raw-v2.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply redesign
        run: python .github/scripts/apply_v23.py
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Commit validated redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py midi_engine.py modern_launcher.py version_info.txt tests/test_profiles.py tests/test_engine.py README.md END_USER_GUIDE.md CHANGELOG.md
          git commit -m "Align player with BPSR categories and raw mode"
          git push origin HEAD:agent/category-profiles-raw-v2.3
