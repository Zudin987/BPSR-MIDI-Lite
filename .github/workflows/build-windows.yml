name: Build Windows EXE

on:
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "modern_launcher.py"
      - "modern_ui.py"
      - "gaming_*.py"
      - "online_*.py"
      - "midi_engine.py"
      - "profiles.py"
      - "player.py"
      - "win_input.py"
      - "theme.py"
      - "BPSR-MIDI-Lite.spec"
      - "requirements*.txt"
      - "version_info.txt"
      - "tests/**"
      - ".github/workflows/build-windows.yml"
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional version to publish, for example v3.1.2. Leave blank to build only."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build standalone EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Lite.spec

      - name: Prepare downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe release/BPSR-MIDI-Lite.exe

          New-Item -ItemType Directory -Force portable/BPSR-MIDI-Lite | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe portable/BPSR-MIDI-Lite/BPSR-MIDI-Lite.exe
          Copy-Item README.md portable/BPSR-MIDI-Lite/README.md
          Copy-Item LICENSE portable/BPSR-MIDI-Lite/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md portable/BPSR-MIDI-Lite/THIRD_PARTY_NOTICES.md

          Compress-Archive -Path portable/BPSR-MIDI-Lite -DestinationPath release/BPSR-MIDI-Lite-Windows-x64.zip -Force

          $hashExe = (Get-FileHash release/BPSR-MIDI-Lite.exe -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash release/BPSR-MIDI-Lite-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BPSR-MIDI-Lite.exe" | Set-Content release/SHA256SUMS.txt
          "$hashZip  BPSR-MIDI-Lite-Windows-x64.zip" | Add-Content release/SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: BPSR-MIDI-Lite-Windows
          path: release/*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.release_version != '') ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[release v'))
      }}
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download built files
        uses: actions/download-artifact@v6
        with:
          name: BPSR-MIDI-Lite-Windows
          path: release

      - name: Publish requested GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [string] $tag = $env:RELEASE_VERSION
          $tag = $tag.Trim()
          if (-not $tag) {
            if ($env:RELEASE_COMMIT_MESSAGE -notmatch '^\[release (v\d+\.\d+\.\d+)\]') {
              throw "Release commits must start with [release vX.Y.Z]"
            }
            $tag = $Matches[1]
          }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version must use vX.Y.Z"
          }

          if (gh release view $tag 2>$null) {
            gh release upload $tag `
              release/BPSR-MIDI-Lite.exe `
              release/BPSR-MIDI-Lite-Windows-x64.zip `
              release/SHA256SUMS.txt `
              --clobber
          } else {
            gh release create $tag `
              release/BPSR-MIDI-Lite.exe `
              release/BPSR-MIDI-Lite-Windows-x64.zip `
              release/SHA256SUMS.txt `
              --target $env:GITHUB_SHA `
              --title "BPSR MIDI Lite $tag" `
              --generate-notes
          }
