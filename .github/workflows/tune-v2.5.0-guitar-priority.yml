name: Tune v2.5.0 Guitar priority

on:
  push:
    branches:
      - agent/v2.5-instrument-aware-fitting
    paths:
      - .github/workflows/tune-v2.5.0-guitar-priority.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/v2.5-instrument-aware-fitting
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tune Guitar priority
        run: python tools/tune_v250_guitar_priority.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run full tests
        run: python -m pytest -q

      - name: Commit validated change and remove migration files
        run: |
          rm -f tools/tune_v250_guitar_priority.py .github/workflows/tune-v2.5.0-guitar-priority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep Guitar melody priority conservative"
          git push origin HEAD:agent/v2.5-instrument-aware-fitting
