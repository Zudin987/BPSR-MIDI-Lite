name: Publish v3.0.2

# One-shot publisher for the validated v3.0.2 Online Sequencer fix.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3.0.2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out merged v3.0.2 source
        uses: actions/checkout@v6
        with:
          ref: 538b0dd44408817a010238306f778cdb7d4f6f98

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build standalone EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Lite.spec

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe release/BPSR-MIDI-Lite.exe

          New-Item -ItemType Directory -Force portable/BPSR-MIDI-Lite | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe portable/BPSR-MIDI-Lite/BPSR-MIDI-Lite.exe
          Copy-Item README.md portable/BPSR-MIDI-Lite/README.md
          Copy-Item LICENSE portable/BPSR-MIDI-Lite/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md portable/BPSR-MIDI-Lite/THIRD_PARTY_NOTICES.md

          Compress-Archive -Path portable/BPSR-MIDI-Lite -DestinationPath release/BPSR-MIDI-Lite-Windows-x64.zip -Force

          $hashExe = (Get-FileHash release/BPSR-MIDI-Lite.exe -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash release/BPSR-MIDI-Lite-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BPSR-MIDI-Lite.exe" | Set-Content release/SHA256SUMS.txt
          "$hashZip  BPSR-MIDI-Lite-Windows-x64.zip" | Add-Content release/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # BPSR MIDI Lite v3.0.2

          Online Sequencer reliability patch:

          - Replaces blocked in-app HTML/search scraping with a browser-assisted title-search flow.
          - Find in browser opens the real Online Sequencer search; paste the chosen song link or ID back into the app and use Check link / ID.
          - Direct link/ID loading uses Online Sequencer's public binary sequence-data endpoint without fake browser headers, cookie warm-up, or repeated 403 retries.
          - Keeps temporary playback, BPSR fit analysis, bookmarks, Save to Local, and cache limits.
          - Keeps Local MIDI playback fully independent and unchanged.
          - Preserves the v3.0.1 dark-mode table/tab styling and browser-launch fallback, with stronger regression tests.
          '@ | Set-Content release-notes.md

          gh release create v3.0.2 `
            release/BPSR-MIDI-Lite.exe `
            release/BPSR-MIDI-Lite-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --target 538b0dd44408817a010238306f778cdb7d4f6f98 `
            --title "BPSR MIDI Lite v3.0.2" `
            --notes-file release-notes.md
