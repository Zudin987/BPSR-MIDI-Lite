name: Apply targeted focus guard once

on:
  push:
    branches:
      - fix/review-security-reliability-20260916
    paths:
      - .github/workflows/apply-focus-guard.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply exact-match guard
        run: python tools/patch_focus.py
      - name: Check syntax, regression and diff
        shell: pwsh
        run: |
          python -m py_compile player.py game_process.py tests/test_game_process.py
          python -m pip install pytest 'mido==1.3.3' 'pynput==1.8.2'
          python -m pytest -q tests/test_game_process.py tests/test_player.py
          git diff --check
      - name: Commit source and remove temporary migration
        shell: pwsh
        run: |
          Remove-Item tools/patch_focus.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player.py tools/patch_focus.py
          git commit -m 'fix: guard keyboard injection by verified BPSR process identity'
          git push origin HEAD:fix/review-security-reliability-20260916
