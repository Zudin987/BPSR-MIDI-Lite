name: Tune v2.5.0 Bass contour

on:
  push:
    branches:
      - agent/v2.5-instrument-aware-fitting
    paths:
      - .github/workflows/tune-v2.5.0-bass-contour.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/v2.5-instrument-aware-fitting
          fetch-depth: 0

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Tune Bass contour policy
        run: python tools/tune_v250_bass_contour.py

      - name: Apply v2.5 product changes
        run: python tools/apply_v250_instrument_policy.py

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run full tests
        run: python -m pytest -q

      - name: Commit validated product changes and remove migration files
        run: |
          rm -f tools/apply_v250_instrument_policy.py tools/tune_v250_bass_contour.py
          rm -f .github/workflows/apply-v2.5.0-instrument-policy.yml .github/workflows/tune-v2.5.0-bass-contour.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add instrument-aware Guitar and Bass fitting"
          git push origin HEAD:agent/v2.5-instrument-aware-fitting
