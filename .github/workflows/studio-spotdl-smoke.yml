name: Studio downloader live search smoke

on:
  pull_request:
    paths:
      - "studio_spotdl*.py"
      - "studio_band/spotdl_worker.py"
      - "studio_band/progress.py"
      - "studio_band/protocol.py"
      - "studio_band/runtime.py"
      - "studio_band/storage.py"
      - "studio_youtube.py"
      - "requirements-studio*.txt"
      - ".github/workflows/studio-spotdl-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "studio_spotdl*.py"
      - "studio_band/spotdl_worker.py"
      - "studio_band/progress.py"
      - "studio_band/protocol.py"
      - "studio_band/runtime.py"
      - "studio_band/storage.py"
      - "studio_youtube.py"
      - "requirements-studio*.txt"
      - ".github/workflows/studio-spotdl-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-search:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-studio-build.txt

      - name: Install Studio test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-studio-build.txt

      - name: Live spotDL metadata search - love story
        shell: pwsh
        run: |
          python -c "import studio_spotdl; import studio_spotdl_fallback as f; studio_spotdl.SpotDLResolver._run_search_worker=f._fast_search_worker; r=studio_spotdl.SpotDLResolver().search('love story', limit=3, progress=print); print('spotDL results:', [(x.title, x.artist, x.store_url) for x in r.tracks]); assert r.tracks and all(x.provider == 'spotdl' for x in r.tracks)"

      - name: Live direct yt-dlp fallback search - love story
        shell: pwsh
        run: |
          python -c "import studio_spotdl_fallback as f; r=f._search_ytdlp('love story', limit=1, progress=print); print('yt-dlp fallback result:', r[0].title, r[0].url); assert r and r[0].url.startswith('https://www.youtube.com/watch?v=')"
