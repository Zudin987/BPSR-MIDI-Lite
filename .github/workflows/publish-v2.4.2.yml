name: Publish v2.4.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.4.2.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out merged v2.4.2 source
        uses: actions/checkout@v6
        with:
          ref: 0e6510c5c2707b79563b9730a5db2fd80b121d7e

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build standalone EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Lite.spec

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe release/BPSR-MIDI-Lite.exe

          New-Item -ItemType Directory -Force portable/BPSR-MIDI-Lite | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe portable/BPSR-MIDI-Lite/BPSR-MIDI-Lite.exe
          Copy-Item README.md portable/BPSR-MIDI-Lite/README.md
          Copy-Item LICENSE portable/BPSR-MIDI-Lite/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md portable/BPSR-MIDI-Lite/THIRD_PARTY_NOTICES.md

          Compress-Archive -Path portable/BPSR-MIDI-Lite -DestinationPath release/BPSR-MIDI-Lite-Windows-x64.zip -Force

          $hashExe = (Get-FileHash release/BPSR-MIDI-Lite.exe -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash release/BPSR-MIDI-Lite-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BPSR-MIDI-Lite.exe" | Set-Content release/SHA256SUMS.txt
          "$hashZip  BPSR-MIDI-Lite-Windows-x64.zip" | Add-Content release/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # BPSR MIDI Lite v2.4.2

          Stability fix for Guitar and Bass Category progression.

          - Guitar Categories 1–3 now use the same stable whole-song fitting strategy before any unavoidable local octave adjustment.
          - Bass Categories 1–2 now use the same stable whole-song fitting strategy.
          - Keyboard fitting is intentionally unchanged.
          - Song Check now counts every played note whose final pitch differs from the original MIDI, including whole-song transposition.
          - Whole-song semitone shifts are shown separately so coherent transposition is not confused with unstable per-note folding.
          - Added Guitar/Bass progression regression tests; larger tested unlock ranges cannot increase local octave-fold distortion.
          - No change to key injection, Ctrl/Shift scheduling, Raw MIDI, page-free behavior, or BPSR note timing.
          '@ | Set-Content release-notes.md

          gh release create v2.4.2 `
            release/BPSR-MIDI-Lite.exe `
            release/BPSR-MIDI-Lite-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --target 0e6510c5c2707b79563b9730a5db2fd80b121d7e `
            --title "BPSR MIDI Lite v2.4.2" `
            --notes-file release-notes.md
