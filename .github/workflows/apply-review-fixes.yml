name: Apply reviewed fixes once

on:
  push:
    branches:
      - fix/review-security-reliability-20260916
    paths:
      - .github/workflows/apply-review-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-match source edits
        run: python tools/run_review_fixes.py
      - name: Validate Python and JavaScript syntax and whitespace
        run: |
          python -m compileall -q band_cloudflare.py band_room_registry.py tests/test_band_cloudflare.py
          node --check cloudflare-band/src/index.js
          git diff --check
      - name: Commit application fixes without workflow edits
        run: |
          git restore .github/workflows/build-windows.yml .github/workflows/build-studio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add band_cloudflare.py band_room_registry.py cloudflare-band/src/index.js tests/test_band_cloudflare.py
          git diff --cached --check
          git commit -m "fix: authenticate Band hosts and harden uploads and sockets"
          git push origin HEAD:fix/review-security-reliability-20260916
