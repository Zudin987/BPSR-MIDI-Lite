name: Stage release candidate version once

on:
  push:
    branches:
      - fix/review-security-reliability-20260916
    paths:
      - .github/workflows/stage-version.yml

permissions:
  contents: write

jobs:
  stage:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Stage versions with exact-match assertions
        run: python tools/stage_release_version.py
      - name: Validate version and full Lite test suite
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Version upgrade failed full pytest' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Version upgrade introduced whitespace errors' }
      - name: Commit staged release candidate without workflow edits
        shell: pwsh
        run: |
          Remove-Item tools/stage_release_version.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add modern_launcher.py build_exe.bat version_info.txt tests/test_release_version_consistency.py tests/test_v303_regressions.py tests/test_ui_contract.py tests/test_ui_2026_contract.py studio_band/__init__.py tests/test_studio_precision_judges.py CHANGELOG.md STUDIO_RELEASE_NOTES.md tools/stage_release_version.py
          git commit -m 'chore: stage v3.5.3 and Studio hotfix10 release candidate'
          git push origin HEAD:fix/review-security-reliability-20260916
