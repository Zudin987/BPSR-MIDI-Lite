name: Build Windows Studio

on:
  push:
    branches:
      - main
    paths:
      - "studio_band/**"
      - "profiles/bpsr_drums.json"
      - "studio_*.py"
      - "studio_version_info.txt"
      - "local_search_integration.py"
      - "gaming_*.py"
      - "ui_*.py"
      - "band_*.py"
      - "BPSR-MIDI-Studio.spec"
      - "requirements-studio*.txt"
      - "STUDIO*.md"
      - "tests/test_studio*.py"
      - "tests/smoke_studio*.py"
      - "tests/test_playback*.py"
      - "tests/test_band*.py"
      - "tests/test_local_search.py"
      - ".github/workflows/build-studio.yml"
      - "app.py"
      - "modern_ui.py"
      - "online_*.py"
      - "playback_*.py"
      - "midi_engine.py"
      - "profiles.py"
      - "player.py"
      - "win_input.py"
      - "theme.py"
  pull_request:
    paths:
      - "studio_band/**"
      - "profiles/bpsr_drums.json"
      - "studio_*.py"
      - "studio_version_info.txt"
      - "local_search_integration.py"
      - "gaming_*.py"
      - "ui_*.py"
      - "band_*.py"
      - "BPSR-MIDI-Studio.spec"
      - "requirements-studio*.txt"
      - "STUDIO*.md"
      - "tests/test_studio*.py"
      - "tests/smoke_studio*.py"
      - "tests/test_playback*.py"
      - "tests/test_band*.py"
      - "tests/test_local_search.py"
      - ".github/workflows/build-studio.yml"
      - "app.py"
      - "modern_ui.py"
      - "online_*.py"
      - "playback_*.py"
      - "midi_engine.py"
      - "profiles.py"
      - "player.py"
      - "win_input.py"
      - "theme.py"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional existing Lite release tag, for example v3.4.0. Leave blank to build only."
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-studio:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Install Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-studio-build.txt

      - name: Install Studio dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-studio-build.txt

      - name: Verify AI and audio runtimes
        shell: pwsh
        run: |
          python -c "from basic_pitch import ICASSP_2022_MODEL_PATH; from basic_pitch.inference import Model; m=Model(ICASSP_2022_MODEL_PATH); print('Basic Pitch model:', ICASSP_2022_MODEL_PATH)"
          python -c "import onnxruntime as ort; print('ONNX providers:', ort.get_available_providers())"
          python -c "from imageio_ffmpeg import get_ffmpeg_exe; import os; p=get_ffmpeg_exe(); print('FFmpeg:', p); assert os.path.exists(p)"
          python -c "import soundcard as sc; print('SoundCard WASAPI loopback API:', hasattr(sc, 'all_microphones'), hasattr(sc, 'get_microphone'))"
          python -c "import studio_audio_latency as s; print('Studio audio detector:', s.SAMPLE_RATE, 'Hz')"

      - name: Record bundled FFmpeg build information
        shell: pwsh
        run: |
          $ffmpeg = python -c "from imageio_ffmpeg import get_ffmpeg_exe; print(get_ffmpeg_exe())"
          & $ffmpeg -version | Set-Content FFMPEG_BUILD_INFO.txt
          & $ffmpeg -buildconf | Add-Content FFMPEG_BUILD_INFO.txt

      - name: Verify first-use YouTube components
        shell: pwsh
        run: |
          python -c "import studio_youtube as s, subprocess; y,d=s.ensure_youtube_components(print); print('yt-dlp:', subprocess.check_output([str(y), '--version'], text=True).strip()); print('Deno:', subprocess.check_output([str(d), '--version'], text=True).splitlines()[0])"

      - name: Live YouTube search smoke test
        continue-on-error: true
        shell: pwsh
        run: |
          python -c "import studio_youtube as s; r=s.search_youtube('Blue Protocol Star Resonance music', limit=1, progress=print); print('Search result:', r[0].title, r[0].url)"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build Studio single EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Studio.spec

      - name: Verify Studio workspace and responsive UI
        shell: pwsh
        run: |
          python tests/smoke_studio_band_ui.py
          python tests/smoke_studio_responsive_ui.py
          python tests/smoke_studio_video_audit.py

      - name: Upload Studio workspace verification
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Studio-workspace-verification
          path: ui-smoke-report/*
          if-no-files-found: warn
          retention-days: 30

      - name: Verify single EXE contains Studio runtimes
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/BPSR-MIDI-Studio.exe")) {
            throw "Studio single EXE was not created"
          }
          $listing = (& pyi-archive_viewer -l "dist/BPSR-MIDI-Studio.exe" | Out-String)
          if ($listing -notmatch '(?i)\.onnx') { throw "Basic Pitch ONNX model was not embedded in the EXE" }
          if ($listing -notmatch '(?i)ffmpeg.*\.exe') { throw "FFmpeg executable was not embedded in the EXE" }
          if ($listing -notmatch '(?i)soundcard') { throw "SoundCard WASAPI loopback runtime was not embedded in the EXE" }
          $analysis = Get-Content "build/BPSR-MIDI-Studio/Analysis-00.toc" -Raw
          if ($analysis -notmatch 'studio_core_transcription') { throw "PyInstaller did not discover the Studio core transcription module" }
          if ($analysis -notmatch 'studio_audio_latency') { throw "PyInstaller did not discover the Studio audio-latency module" }
          if ($analysis -notmatch 'studio_band.resolver') { throw "PyInstaller did not discover the Studio music resolver" }
          $size = (Get-Item "dist/BPSR-MIDI-Studio.exe").Length
          if ($size -lt 50000000) { throw "Studio EXE is unexpectedly small; bundled runtime may be missing" }
          Write-Host "Studio single EXE size: $size bytes"

      - name: Prepare Studio download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-studio | Out-Null
          Copy-Item "dist/BPSR-MIDI-Studio.exe" "release-studio/BPSR-MIDI-Studio-Experimental-Beta.exe"
          Copy-Item STUDIO_THIRD_PARTY_NOTICES.md release-studio/STUDIO_THIRD_PARTY_NOTICES.md
          Copy-Item STUDIO_BAND_ACCURATE.md release-studio/STUDIO_BAND_ACCURATE.md
          Copy-Item FFMPEG_BUILD_INFO.txt release-studio/FFMPEG_BUILD_INFO.txt
          $hash = (Get-FileHash release-studio/BPSR-MIDI-Studio-Experimental-Beta.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  BPSR-MIDI-Studio-Experimental-Beta.exe" | Set-Content release-studio/SHA256SUMS-STUDIO.txt
          $zipFiles = @(
            "release-studio/BPSR-MIDI-Studio-Experimental-Beta.exe"
            "release-studio/SHA256SUMS-STUDIO.txt"
            "release-studio/STUDIO_THIRD_PARTY_NOTICES.md"
            "release-studio/STUDIO_BAND_ACCURATE.md"
            "release-studio/FFMPEG_BUILD_INFO.txt"
          )
          Compress-Archive -LiteralPath $zipFiles -DestinationPath release-studio/BPSR-MIDI-Studio-beta.9-Windows.zip

      - name: Smoke test frozen Studio worker without launching the GUI
        shell: pwsh
        run: python tests/smoke_frozen_studio.py dist/BPSR-MIDI-Studio.exe

      - name: Upload Studio artifact
        uses: actions/upload-artifact@v6
        with:
          name: BPSR-MIDI-Studio-Experimental-Beta-Windows
          path: release-studio/*
          if-no-files-found: error
          retention-days: 30

  release-studio:
    needs: build-studio
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.release_version != '') ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[release v'))
      }}
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download Studio build files
        uses: actions/download-artifact@v6
        with:
          name: BPSR-MIDI-Studio-Experimental-Beta-Windows
          path: release-studio

      - name: Attach and verify Studio experimental beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          [string] $tag = $env:RELEASE_VERSION
          $tag = $tag.Trim()
          if (-not $tag) {
            if ($env:RELEASE_COMMIT_MESSAGE -notmatch '^\[release (v\d+\.\d+\.\d+)\]') {
              throw "Release commits must start with [release vX.Y.Z]"
            }
            $tag = $Matches[1]
          }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release version must use vX.Y.Z"
          }

          $deadline = (Get-Date).AddMinutes(10)
          while ($true) {
            gh release view $tag 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { break }
            if ((Get-Date) -ge $deadline) {
              throw "Lite release $tag was not available within 10 minutes"
            }
            Write-Host "Waiting for Lite release $tag before attaching Studio..."
            Start-Sleep -Seconds 15
          }

          gh release delete-asset $tag BPSR-MIDI-Studio-beta.8-Windows.zip -y 2>$null | Out-Null
          gh release upload $tag `
            release-studio/BPSR-MIDI-Studio-beta.9-Windows.zip `
            release-studio/BPSR-MIDI-Studio-Experimental-Beta.exe `
            release-studio/SHA256SUMS-STUDIO.txt `
            release-studio/STUDIO_THIRD_PARTY_NOTICES.md `
            release-studio/STUDIO_BAND_ACCURATE.md `
            release-studio/FFMPEG_BUILD_INFO.txt `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw "Studio release asset upload failed" }

          $verifyDir = Join-Path $env:RUNNER_TEMP "bpsr-studio-release-verify"
          if (Test-Path $verifyDir) { Remove-Item $verifyDir -Recurse -Force }
          New-Item -ItemType Directory -Force $verifyDir | Out-Null
          gh release download $tag `
            --dir $verifyDir `
            --pattern "BPSR-MIDI-Studio-beta.9-Windows.zip" `
            --pattern "BPSR-MIDI-Studio-Experimental-Beta.exe" `
            --pattern "SHA256SUMS-STUDIO.txt" `
            --pattern "STUDIO_THIRD_PARTY_NOTICES.md" `
            --pattern "STUDIO_BAND_ACCURATE.md" `
            --pattern "FFMPEG_BUILD_INFO.txt"
          if ($LASTEXITCODE -ne 0) { throw "Could not download published Studio assets for verification" }

          foreach ($name in @("BPSR-MIDI-Studio-beta.9-Windows.zip", "BPSR-MIDI-Studio-Experimental-Beta.exe", "SHA256SUMS-STUDIO.txt", "STUDIO_THIRD_PARTY_NOTICES.md", "STUDIO_BAND_ACCURATE.md", "FFMPEG_BUILD_INFO.txt")) {
            $local = Join-Path "release-studio" $name
            $remote = Join-Path $verifyDir $name
            if (-not (Test-Path $remote)) { throw "Published release is missing Studio asset $name" }
            $localHash = (Get-FileHash $local -Algorithm SHA256).Hash.ToLower()
            $remoteHash = (Get-FileHash $remote -Algorithm SHA256).Hash.ToLower()
            if ($localHash -ne $remoteHash) {
              throw "Published Studio asset hash mismatch for $name"
            }
          }
          Write-Host "Published Studio release assets match the validated workflow outputs byte-for-byte."
