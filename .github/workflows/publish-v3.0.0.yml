name: Publish v3.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v3.0.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out merged v3.0.0 source
        uses: actions/checkout@v6
        with:
          ref: ae7a5356d163828eb367c3d8f5cad385369bdfb1

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build standalone EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Lite.spec

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe release/BPSR-MIDI-Lite.exe

          New-Item -ItemType Directory -Force portable/BPSR-MIDI-Lite | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe portable/BPSR-MIDI-Lite/BPSR-MIDI-Lite.exe
          Copy-Item README.md portable/BPSR-MIDI-Lite/README.md
          Copy-Item LICENSE portable/BPSR-MIDI-Lite/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md portable/BPSR-MIDI-Lite/THIRD_PARTY_NOTICES.md

          Compress-Archive -Path portable/BPSR-MIDI-Lite -DestinationPath release/BPSR-MIDI-Lite-Windows-x64.zip -Force

          $hashExe = (Get-FileHash release/BPSR-MIDI-Lite.exe -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash release/BPSR-MIDI-Lite-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BPSR-MIDI-Lite.exe" | Set-Content release/SHA256SUMS.txt
          "$hashZip  BPSR-MIDI-Lite-Windows-x64.zip" | Add-Content release/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # BPSR MIDI Lite v3.0.0

          Online Sequencer is now an optional first-class song source inside BPSR MIDI Lite.

          - Search public Online Sequencer songs by title, or paste a sequence link / ID.
          - See Ready / Busy / Crowded plus Remap / Skip / Filter and playable-note counts before saving a permanent copy.
          - Play selected online songs directly from bounded temporary cache with the normal Play in BPSR button.
          - Bookmark online songs inside the app, or use Save to Local for a permanent offline MIDI copy.
          - Online sequence data is converted to standard MIDI and passed through the exact existing BPSR planner, including Piano/Guitar/Bass instrument-aware fitting and no-page safety.
          - Current Online Sequencer preview-card search markup was verified with a temporary live smoke test before release: search, public sequence fetch, conversion, and BPSR planning all completed successfully.
          - Local MIDI playback remains independent from the online feature and continues to work offline.
          - Added conservative cache/network/note limits and background processing so online work does not block the UI.
          - No Online Sequencer account credentials are requested or stored.

          Online Sequencer is a third-party service; BPSR MIDI Lite is not affiliated with or endorsed by Online Sequencer.
          '@ | Set-Content release-notes.md

          gh release create v3.0.0 `
            release/BPSR-MIDI-Lite.exe `
            release/BPSR-MIDI-Lite-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --target ae7a5356d163828eb367c3d8f5cad385369bdfb1 `
            --title "BPSR MIDI Lite v3.0.0" `
            --notes-file release-notes.md
