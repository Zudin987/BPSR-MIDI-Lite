name: Publish v2.4.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.4.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022
    steps:
      - name: Check out merged v2.4.0 source
        uses: actions/checkout@v6
        with:
          ref: 19002a673e04198006fea96af4e62a47ef66ee9c

      - name: Install Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Build standalone EXE
        shell: pwsh
        run: pyinstaller --noconfirm --clean BPSR-MIDI-Lite.spec

      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe release/BPSR-MIDI-Lite.exe

          New-Item -ItemType Directory -Force portable/BPSR-MIDI-Lite | Out-Null
          Copy-Item dist/BPSR-MIDI-Lite.exe portable/BPSR-MIDI-Lite/BPSR-MIDI-Lite.exe
          Copy-Item README.md portable/BPSR-MIDI-Lite/README.md
          Copy-Item LICENSE portable/BPSR-MIDI-Lite/LICENSE
          Copy-Item THIRD_PARTY_NOTICES.md portable/BPSR-MIDI-Lite/THIRD_PARTY_NOTICES.md

          Compress-Archive -Path portable/BPSR-MIDI-Lite -DestinationPath release/BPSR-MIDI-Lite-Windows-x64.zip -Force

          $hashExe = (Get-FileHash release/BPSR-MIDI-Lite.exe -Algorithm SHA256).Hash.ToLower()
          $hashZip = (Get-FileHash release/BPSR-MIDI-Lite-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashExe  BPSR-MIDI-Lite.exe" | Set-Content release/SHA256SUMS.txt
          "$hashZip  BPSR-MIDI-Lite-Windows-x64.zip" | Add-Content release/SHA256SUMS.txt

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          @'
          # BPSR MIDI Lite v2.4.0

          Final UI/UX cleanup release.

          - The whole app is now vertically scrollable and works comfortably in smaller/shorter windows.
          - Removed More settings and all Open folder buttons.
          - Countdown now lives directly in the Play section.
          - Restore recommended settings and Troubleshooting are directly on the main page under Help & recovery.
          - Song Check once again shows explicit Remapped, Skipped, and Filtered/simplified note counts.
          - README is now the single consolidated user/developer guide.
          - Removed stale duplicate release-note files, old screenshots, duplicate guide, and MIDI placeholder clutter.
          - Portable ZIP contents were simplified.
          - No MIDI engine, instrument range, profile mapping, input scheduler, or v2.1 timing behavior changed in this release.
          '@ | Set-Content release-notes.md

          gh release create v2.4.0 `
            release/BPSR-MIDI-Lite.exe `
            release/BPSR-MIDI-Lite-Windows-x64.zip `
            release/SHA256SUMS.txt `
            --target 19002a673e04198006fea96af4e62a47ef66ee9c `
            --title "BPSR MIDI Lite v2.4.0" `
            --notes-file release-notes.md
